<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PoB Pocket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Spectral+SC:wght@600&display=swap">
<style>
/* Layout: one phone column. Header with pinned build stats, a scrolling view, a fixed bottom tab bar. Chat is home. */
:root {
  --bg: #0e1115;
  --surface: #161a20;
  --surface-2: #1d232b;
  --line: #2a313b;
  --fg: #e8e6e1;
  --muted: #8d95a1;
  --accent: #6fc3bd;
  --accent-ink: #08201e;
  --good: #7cc48a;
  --bad: #e2725f;
  --unique: #c8793a;
  --rare: #e4d96a;
  --magic: #8f97ff;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-title: "Spectral SC", Georgia, "Times New Roman", serif;
  --r: 12px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0f2; --surface: #ffffff; --surface-2: #f4f6f8; --line: #d6dbe1; --fg: #15191e; --muted: #5d6672;
    --accent: #1f7f78; --accent-ink: #ffffff; --good: #2b8a3e; --bad: #c2412c; --unique: #a3561c; --rare: #8a7a00; --magic: #4b55d6;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0f2; --surface: #ffffff; --surface-2: #f4f6f8; --line: #d6dbe1; --fg: #15191e; --muted: #5d6672;
  --accent: #1f7f78; --accent-ink: #ffffff; --good: #2b8a3e; --bad: #c2412c; --unique: #a3561c; --rare: #8a7a00; --magic: #4b55d6;
  color-scheme: light;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-ui); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.app { height: 100%; max-width: 480px; margin: 0 auto; display: grid; grid-template-rows: auto 1fr auto; background: var(--bg); border-inline: 1px solid var(--line); position: relative; overflow: hidden; }
@media (max-width: 480px) { .app { border-inline: 0; } }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
header { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px 10px; }
.buildline { display: flex; align-items: center; gap: 10px; }
.classmark { width: 34px; height: 34px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font: 600 15px var(--font-title); color: var(--accent); flex: none; }
.buildname { min-width: 0; flex: 1; }
.buildname b { display: block; font: 600 17px/1.15 var(--font-title); letter-spacing: .02em; }
.buildname span { color: var(--muted); font-size: 12.5px; }
.iconbtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg { width: 18px; height: 18px; stroke: var(--fg); fill: none; stroke-width: 1.8; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; min-width: 0; transition: border-color .2s; }
.stat small { display: block; color: var(--muted); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }
.stat .v { font: 600 15px/1.3 var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .d { display: block; font: 600 11px var(--font-num); min-height: 14px; }
.stat.changed { border-color: var(--accent); }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
.previewnote { margin-top: 8px; font-size: 12.5px; color: var(--accent); display: flex; gap: 8px; align-items: center; }
.previewnote button { margin-left: auto; background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px 0; }

/* Views */
main { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; position: relative; }
.view { padding-block: 14px 24px; display: flex; flex-direction: column; gap: 12px; }
.view[hidden] { display: none !important; }
h2 { margin: 4px 0 0; font: 600 13px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Chat */
.chatview { min-height: 100%; padding-bottom: 0; }
.msgs { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.sys { align-self: center; font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; text-align: center; }
.me { align-self: flex-end; max-width: 85%; background: var(--accent); color: var(--accent-ink); padding: 9px 13px; border-radius: 16px 16px 4px 16px; font-weight: 500; }
.bot { max-width: 100%; display: flex; flex-direction: column; gap: 10px; }
.bot p { margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; transition: border-color .2s, background .2s; }
.card.previewing { border-color: var(--accent); }
.card.kept { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.cardhead { display: flex; gap: 8px; align-items: baseline; }
.cardhead b { flex: 1; font-weight: 600; }
.where { font-size: 12px; color: var(--muted); }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--good); }
.mods { margin: 0; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font-size: 13px; color: var(--magic); list-style: none; display: grid; gap: 2px; }
.deltas { display: grid; grid-template-columns: 1fr auto auto; gap: 3px 12px; font-size: 13.5px; }
.deltas .k { color: var(--muted); }
.deltas .n { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 13.5px; cursor: pointer; min-height: 38px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btn.ghost { background: transparent; }
.summary { font-size: 13.5px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.summary span { flex: 1; min-width: 180px; }
.typing { display: inline-flex; gap: 4px; padding: 10px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .25; } }
.toolrun { font-size: 12px; color: var(--muted); font-family: var(--font-num); }
.composer { position: sticky; bottom: 0; background: linear-gradient(to bottom, transparent, var(--bg) 22%); padding-block: 14px 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding-inline: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
.inputrow { display: flex; gap: 8px; }
.inputrow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 11px 14px; font: inherit; font-size: 16px; }
.inputrow button { width: 46px; border-radius: 12px; border: 0; background: var(--accent); cursor: pointer; display: grid; place-items: center; }
.inputrow svg { width: 20px; height: 20px; stroke: var(--accent-ink); fill: none; stroke-width: 2; }

/* Lists */
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: flex; gap: 12px; align-items: center; padding: 11px 12px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.row:first-child { border-top: 0; }
.row .slot { width: 64px; flex: none; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.row .body { flex: 1; min-width: 0; }
.row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .chev { color: var(--muted); }
.r-UNIQUE { color: var(--unique); } .r-RARE { color: var(--rare); } .r-MAGIC { color: var(--magic); }
.badge { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--good); border: 1px solid currentColor; border-radius: 6px; padding: 1px 5px; flex: none; }
.row.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--accent) 22%, transparent); } 100% { background: transparent; } }

.gems { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 12px; }
.gem { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.gem.sup { padding-left: 14px; color: var(--muted); }
.gem .num { color: var(--muted); font-size: 12.5px; }
.grouphead { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.mainmark { color: var(--accent); font-weight: 700; }

.statrow { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 14px; }
.statrow:first-child { border-top: 0; }
.statrow .k { color: var(--muted); }
.statrow .n { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.statrow.flash { animation: flash 1.6s ease-out 1; }

/* More: a stack of nested lists */
.navhead { display: flex; align-items: center; gap: 6px; min-height: 36px; }
.navhead h1 { margin: 0; font: 600 20px var(--font-title); letter-spacing: .02em; flex: 1; min-width: 0; }
.back { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 6px 8px 6px 0; cursor: pointer; display: flex; align-items: center; gap: 2px; font-size: 15px; }
.back svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.navrow { display: flex; align-items: center; gap: 12px; padding: 12px; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; }
.navrow:first-child { border-top: 0; }
.navrow .ico { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.navrow .ico svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.navrow .body { flex: 1; min-width: 0; }
.navrow .title { font-weight: 600; }
.navrow .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navrow .val { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13.5px; }
.navrow .chev { color: var(--muted); font-size: 18px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-top: 1px solid var(--line); }
.opt:first-child { border-top: 0; }
.opt .body { flex: 1; min-width: 0; }
.opt .title { font-size: 14.5px; }
.opt .sub { font-size: 12.5px; color: var(--muted); }
.switch { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); transition: transform .15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); background: var(--accent-ink); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 7px 0; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.impact { font-size: 12.5px; font-family: var(--font-num); }
.cfgnote { margin-top: 8px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.cfgnote b { color: var(--fg); font-weight: 600; }
.cfgnote button { margin-left: auto; background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px 0; }
textarea.notes { width: 100%; min-height: 220px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: var(--r); padding: 12px; font: inherit; font-size: 16px; resize: vertical; }
.empty { color: var(--muted); font-size: 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; }

/* Tree */
.treeview { padding: 0; height: 100%; position: relative; }
#tree { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.treehud { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.treehud > * { pointer-events: auto; }
.pill { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; }
.treenote { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }

/* Tab bar */
nav { background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav button { background: none; border: 0; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); cursor: pointer; position: relative; min-height: 52px; }
nav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-selected="true"] { color: var(--accent); }
nav .dot { position: absolute; top: 6px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* Bottom sheet */
.scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { visibility: hidden; position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; transform: translateY(105%); transition: transform .25s ease; max-height: 78%; overflow-y: auto; padding-block: 8px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet.open { transform: none; visibility: visible; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet h3 { margin: 0 0 2px; font: 600 18px var(--font-title); letter-spacing: .02em; }
.sheet .base { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.sheet .mods { font-size: 14px; }
.sheet .mods .new { color: var(--good); }
.sheetactions { display: flex; gap: 8px; margin-top: 14px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="pad">
    <div class="buildline">
      <div class="classmark" aria-hidden="true">Oc</div>
      <div class="buildname"><b>Occultist Vortex</b><span>Witch · Level 99 · Tree 3.13</span></div>
      <button class="iconbtn" id="buildsBtn" aria-label="Switch build"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="cfgnote" id="cfgnote" hidden><span id="cfgtext"></span><button id="cfgReset">Reset</button></div>
    <div class="previewnote" id="previewnote" hidden><span id="previewtext">Previewing</span><button id="endPreview">Stop preview</button></div>
  </header>

  <main id="main">
    <section class="view chatview pad" id="v-chat">
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <form class="inputrow" id="composer">
          <input id="ask" autocomplete="off" placeholder="Ask about this build">
          <button type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
        </form>
      </div>
    </section>
    <section class="view treeview" id="v-tree" hidden>
      <canvas id="tree"></canvas>
      <div class="treehud"><span class="pill">122 / 123 points</span><span class="pill">Drag · pinch · tap a node</span></div>
      <div class="treenote">Placeholder tree: layout only</div>
    </section>
    <section class="view pad" id="v-gear" hidden></section>
    <section class="view pad" id="v-skills" hidden></section>
    <section class="view pad" id="v-more" hidden></section>
  </main>

  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="chat" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Ask</button>
    <button role="tab" data-tab="tree" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="17" r="2"/><circle cx="19" cy="17" r="2"/><circle cx="12" cy="13" r="2"/><path d="M12 7v4M10.5 14.5l-4 1.5M13.5 14.5l4 1.5"/></svg>Tree</button>
    <button role="tab" data-tab="gear" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg>Gear</button>
    <button role="tab" data-tab="skills" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 3l3 6 6 1-4.5 4 1 6-5.5-3-5.5 3 1-6L3 10l6-1z"/></svg>Skills</button>
    <button role="tab" data-tab="more" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet pad" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetbody"></div></div>

function fmt(v, kind) {
  if (v == null) return "-";
  if (kind === "pct") return Math.round(v) + "%";
  if (kind === "ms") return "+" + Math.round((v - 1) * 100) + "%";
  if (kind === "dec") return v.toFixed(2);
  if (Math.abs(v) >= 100000) return (v / 1000).toFixed(1) + "k";
  if (Math.abs(v) >= 10000) return (v / 1000).toFixed(1) + "k";
  return Math.round(v).toLocaleString("en-US");
}
function delta(a, b, kind) {
  const d = b - a;
  if (Math.abs(d) < 0.005) return { text: "±0", cls: "flat" };
  const sign = d > 0 ? "+" : "−";
  let text;
  if (kind === "pct") text = sign + Math.abs(Math.round(d)) + "%";
  else if (Math.abs(d) >= 10000) text = sign + (Math.abs(d) / 1000).toFixed(1) + "k";
  else text = sign + Math.abs(Math.round(d)).toLocaleString("en-US");
  return { text, cls: d > 0 ? "up" : "down" };
}
const relPct = (a, b) => (a ? ((b - a) / a) * 100 : 0);

  t.innerHTML = `<p>Your weakest point is <b>physical hits</b> (18.6k max hit). You also have <b>no spell mitigation</b>, and chaos res is 7% under the cap. Each of these adds about 5% EHP, and none of them costs damage:</p>`;

      <div class="sub">Bosses have more resistances and deal more damage. DPS against this enemy: <span class="num">${fmt(s.CombinedDPS)}</span></div></div></div>` +
      groups.map((g) => `<h2>${g}</h2><div class="group">${TOGGLES.map((t, i) => t[2] !== g ? "" : `<label class="opt"><span class="body"><div class="title">${t[1]}</div><div class="sub impact">If ${cfg.bits[i] ? "off" : "on"}: ${impactOf((c) => (c.bits[i] = c.bits[i] ? 0 : 1))}</div></span><input type="checkbox" class="switch" data-bit="${i}" ${cfg.bits[i] ? "checked" : ""}></label>`).join("")}</div>`).join("");
  }
  if (id === "notes") return `<textarea class="notes" id="notes" aria-label="Build notes">Leveling: Freezing Pulse until 28, then Vortex with Cold Snap.
Gear goals: cap chaos res, then 30%+ spell suppression.
Boss swap: Cold Snap of Power, Hypothermia over Efficacy.</textarea>`;
  if (id === "party") return `<div class="empty">No party members. Add a build's auras, curses and buffs here to see how a party changes your numbers.</div>`;
  if (id === "builds") return `<div class="group"><button class="navrow"><span class="body"><div class="title">Occultist Vortex</div><div class="sub">Open now · Level 99</div></span><span class="badge">Open</span></button>
    ${navrow("builds", "Import a build", "Paste a PoB code or a pobb.in, poe.ninja or Maxroll link")}${navrow("builds", "New build", "Start from a class")}</div>`;
  if (id === "settings") return `<div class="group">${navrow("settings", "Assistant", "Claude · API key saved")}${navrow("settings", "Game", "Path of Exile 1")}${navrow("settings", "Theme", "Match system")}</div>`;

}
function renderMore() {
  const id = moreStack[moreStack.length - 1], parent = moreStack[moreStack.length - 2];
  document.getElementById("v-more").innerHTML = `${parent ? `<div class="navhead"><button class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>${titleOf(parent)}</button></div>` : ""}
    <div class="navhead" style="min-height:0"><h1>${titleOf(id)}</h1></div>${page(id)}`;
}
const vMore = document.getElementById("v-more");
vMore.addEventListener("click", (e) => {
  const m = document.getElementById("main");
  if (e.target.closest("[data-back]")) { moreStack.pop(); renderMore(); m.scrollTop = 0; return; }
  const n = e.target.closest("[data-nav]"); if (n && n.dataset.nav !== moreStack[moreStack.length - 1]) { moreStack.push(n.dataset.nav); renderMore(); m.scrollTop = 0; return; }
  const b = e.target.closest("[data-boss]"); if (b) { cfg.boss = +b.dataset.boss; renderCards(); }
});
vMore.addEventListener("change", (e) => { const t = e.target.closest("[data-bit]"); if (t) { cfg.bits[+t.dataset.bit] = t.checked ? 1 : 0; renderCards(); } });
document.getElementById("cfgReset").addEventListener("click", () => { cfg.boss = CFG_DEFAULT.boss; cfg.bits = [...CFG_DEFAULT.bits]; renderCards(); });
function renderCfgNote() {
  const n = document.getElementById("cfgnote"); n.hidden = !cfgChanged();
  if (cfgChanged()) document.getElementById("cfgtext").innerHTML = `Config changed: <b>${cfgSummary()}</b>`;
}

/* Tabs */
let current = "chat";
function go(tab) {
  current = tab;
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
  document.querySelectorAll(".view").forEach((v) => (v.hidden = v.id !== "v-" + tab));
  const m = document.getElementById("main");
  if (tab === "tree") { m.style.overflow = "hidden"; m.scrollTop = 0; drawTree(); } else m.style.overflow = "";
  if (tab === "chat") scrollChat(); else if (tab !== "tree") m.scrollTop = 0;
  updateDot();
}
function updateDot() { const b = document.querySelector('nav [data-tab="gear"]'); b.querySelector(".dot")?.remove(); if ((kept.has(1) || kept.has(2)) && current !== "gear") b.insertAdjacentHTML("beforeend", '<span class="dot"></span>'); }
function flash(s) {
  requestAnimationFrame(() => {
    const el = s.slot ? document.querySelector(`#v-gear .row[data-slot="${s.slot}"]`) : document.querySelector(`#v-more .statrow[data-key="${s.key}"]`);
    if (!el) return; const m = document.getElementById("main"); m.scrollTop = el.getBoundingClientRect().top - m.getBoundingClientRect().top + m.scrollTop - m.clientHeight / 2 + el.offsetHeight / 2; el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  });
}
document.getElementById("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.tab === "more" && current === "more" && moreStack.length > 1) { moreStack = ["root"]; renderMore(); } go(b.dataset.tab); });

/* Sheet */
function openSheet(html) { document.getElementById("sheetbody").innerHTML = html; document.getElementById("sheet").classList.add("open"); document.getElementById("scrim").classList.add("open"); }
function closeSheet() { document.getElementById("sheet").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); }
document.getElementById("scrim").addEventListener("click", closeSheet);
document.getElementById("sheet").addEventListener("click", (e) => {
  if (e.target.closest("[data-close]")) closeSheet();
  const a = e.target.closest("[data-ask]"); if (a) { closeSheet(); go("chat"); ask(a.dataset.ask); }
});
document.getElementById("buildsBtn").addEventListener("click", () => openSheet(`<h3>Builds</h3><div class="base">Saved builds and import</div>
  <div class="group"><button class="row"><span class="body"><div class="title">Occultist Vortex</div><div class="sub">Open now · Level 99</div></span><span class="badge">Open</span></button>
  <button class="row"><span class="body"><div class="title">Import a build</div><div class="sub">Paste a PoB code or a pobb.in, poe.ninja or Maxroll link</div></span><span class="chev">›</span></button></div>
  <div class="sheetactions"><button class="btn" data-close>Close</button></div>`));

/* Placeholder tree: random constellations, pan and pinch with pointer events, tap a node for its sheet */
const cv = document.getElementById("tree"), ctx = cv.getContext("2d");
let nodes = [], edges = [], view = { x: 0, y: 0, s: 0.55 };
(function seed() {
  let r = 7; const rnd = () => ((r = (r * 16807) % 2147483647) / 2147483647);
  const names = ["Heart of Ice", "Arcane Guarding", "Fettle", "Discipline and Training", "Written in Blood", "Cruel Preparation", "Frozen Legion", "Wish for Death", "Constitution", "Light of Divinity"];
  for (let c = 0; c < 22; c++) {
    const a = rnd() * Math.PI * 2, d = 140 + rnd() * 620, cx = Math.cos(a) * d, cy = Math.sin(a) * d, start = nodes.length, n = 4 + Math.floor(rnd() * 5);
    for (let i = 0; i < n; i++) { const t = (i / n) * Math.PI * 2; nodes.push({ x: cx + Math.cos(t) * 46, y: cy + Math.sin(t) * 46, alloc: rnd() < 0.45, notable: i === 0, name: i === 0 ? names[c % names.length] : "+10 to maximum Life" }); if (i) edges.push([start + i - 1, start + i]); }
    nodes.push({ x: cx, y: cy, alloc: rnd() < 0.3, keystone: c % 7 === 0, notable: false, name: c % 7 === 0 ? "Elemental Overload" : "8% increased maximum Life" }); edges.push([start, nodes.length - 1]);
    if (c) edges.push([start, Math.floor(rnd() * start)]);
  }
})();
function size() { const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return r; }
function drawTree() {
  if (document.getElementById("v-tree").hidden) return;
  const r = size(), css = getComputedStyle(document.documentElement);
  const col = (n) => css.getPropertyValue(n).trim();
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.save(); ctx.translate(r.width / 2 + view.x, r.height / 2 + view.y); ctx.scale(view.s, view.s);
  ctx.lineWidth = 3;
  for (const [a, b] of edges) { const A = nodes[a], B = nodes[b]; ctx.strokeStyle = A.alloc && B.alloc ? col("--accent") : col("--line"); ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke(); }
  for (const n of nodes) { const rad = n.keystone ? 18 : n.notable ? 13 : 8; ctx.beginPath(); ctx.arc(n.x, n.y, rad, 0, Math.PI * 2); ctx.fillStyle = n.alloc ? col("--accent") : col("--surface-2"); ctx.fill(); ctx.strokeStyle = n.alloc ? col("--accent") : col("--muted"); ctx.lineWidth = 2; ctx.stroke(); }
  ctx.restore();
}
const pts = new Map(); let pinch0 = null, moved = 0;
cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s: view.s }; } });
cv.addEventListener("pointermove", (e) => {
  const p = pts.get(e.pointerId); if (!p) return;
  if (pts.size === 1) { view.x += e.clientX - p.x; view.y += e.clientY - p.y; moved += Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y); }
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 2 && pinch0) { const [a, b] = [...pts.values()]; view.s = Math.min(2.5, Math.max(0.25, pinch0.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch0.d)); moved = 99; }
  drawTree();
});
cv.addEventListener("pointerup", (e) => {
  pts.delete(e.pointerId); if (pts.size < 2) pinch0 = null;
  if (moved > 8) return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left - r.width / 2 - view.x) / view.s, y = (e.clientY - r.top - r.height / 2 - view.y) / view.s;
  const hit = nodes.find((n) => Math.hypot(n.x - x, n.y - y) < (n.keystone ? 24 : 18) / Math.min(1, view.s));
  if (hit) openSheet(`<h3>${hit.name}</h3><div class="base">${hit.keystone ? "Keystone" : hit.notable ? "Notable" : "Passive"} · ${hit.alloc ? "Allocated" : "Not allocated"}</div><ul class="mods"><li>${hit.name}</li></ul>
    <div class="sheetactions">${hit.alloc ? '<button class="btn" data-close>Refund</button>' : '<button class="btn primary" data-close>Allocate</button>'}<button class="btn" data-ask="Is ${hit.name} worth it for this build?">Ask about this node</button></div>`);
});
cv.addEventListener("pointercancel", (e) => pts.delete(e.pointerId));
cv.addEventListener("wheel", (e) => { e.preventDefault(); view.s = Math.min(2.5, Math.max(0.25, view.s * (e.deltaY < 0 ? 1.1 : 0.9))); drawTree(); }, { passive: false });
addEventListener("resize", drawTree);

/* Boot: the build is loaded and the first question is ready to send */
add("Opened <b>Occultist Vortex</b> from a PoB build file", "sys");
add(`<p>Build loaded. ${fmt(STATES[""].CombinedDPS)} DPS, ${fmt(STATES[""].Life)} life, ${fmt(STATES[""].TotalEHP)} effective hit pool. What do you want to work on?</p>`, "bot");
setChips(["How do I get tankier without losing damage?", "Where's my damage from?", "Cheapest DPS upgrade", "Cap my chaos res"]);
renderHeader(); renderGear(); renderSkills(); renderMore();
</script>
